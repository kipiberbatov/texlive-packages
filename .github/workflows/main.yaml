name: Main workflow

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: '0 2 1 * *' # Run on the 1st of every month

jobs:
  build:
    name: Build and Release Portable TeX Live
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set TeX Live version and paths
        id: paths
        run: |
          echo "TEXLIVE_DIR=$GITHUB_WORKSPACE/texlive-portable" >> $GITHUB_ENV
          echo "TEXLIVE_YEAR=$(date +%Y)" >> $GITHUB_ENV
          echo "RELEASE_TAG=tl-$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Install TeX Live (Symlink Hijack Method)
        run: |
          # 1. This is the directory that will become our final portable installation.
          INSTALL_DIR="${{ env.TEXLIVE_DIR }}"
          mkdir -p "$INSTALL_DIR"

          # 2. THE HIJACK:
          # The installer insists on writing to /usr/local/texlive. We will
          # delete that path (if it exists) and replace it with a symbolic
          # link to the directory we actually want to install into.
          echo "Hijacking /usr/local/texlive to point to our workspace directory..."
          sudo rm -rf /usr/local/texlive
          sudo ln -s "$INSTALL_DIR" /usr/local/texlive

          # 3. Download and extract the installer as before.
          wget http://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
          tar -xzf install-tl-unx.tar.gz
          cd install-tl-*/

          # 4. Use an absolutely minimal profile.
          # We DO NOT specify TEXDIR here. We let the installer use its
          # default location, which we have now hijacked.
          cat > minimal.profile <<EOF
          selected_scheme scheme-minimal
          option_doc 0
          option_src 0
          EOF

          echo "--- Installer will now write to its default path, which is a symlink ---"
          ls -ld /usr/local/texlive

          # 5. Run the installer. It will think it's performing a system
          # install, but all files will land in our $INSTALL_DIR.
          # No special flags like -portable are needed because we are letting
          # it do what it wants, just to a location we control.
          ./install-tl --profile=minimal.profile -no-gui

          # 6. Set the path for future steps AND the current step
          #    Find the bin directory using a wildcard
          TEXLIVE_BIN_DIR=$(find "$INSTALL_DIR" -type d -name "x86_64-linux")
          
          # Add to GITHUB_PATH for subsequent steps in the job
          echo "$TEXLIVE_BIN_DIR" >> $GITHUB_PATH
          
          # THE FIX: Add to the current shell's PATH for commands in this step
          export PATH="$TEXLIVE_BIN_DIR:$PATH"

          # 7. Verify the installation
          echo "Installation successful. tlmgr is now in the PATH:"
          which tlmgr
          tlmgr --version

      - name: Add TeX Live to PATH
        run: |
          echo "$TEXLIVE_DIR/$TEXLIVE_YEAR/bin/x86_64-linux" >> $GITHUB_PATH

      - name: Install TeX Live Collections and Packages
        run: |
          # Update the package manager to the latest version from the network
          tlmgr option repository ctan

          # Install all packages listed in packages.txt
          cat $GITHUB_WORKSPACE/packages.txt | xargs tlmgr install

      - name: Clean up unnecessary files
        run: |
          # This step is crucial for keeping the final archive size down.
          rm -rf $TEXLIVE_DIR/$TEXLIVE_YEAR/install-tl.log
          rm -rf $TEXLIVE_DIR/$TEXLIVE_YEAR/texmf-dist/doc
          rm -rf $TEXLIVE_DIR/$TEXLIVE_YEAR/texmf-dist/source
          rm -rf $TEXLIVE_DIR/$TEXLIVE_YEAR/texmf-dist/man

      - name: Create TeX Live Tarball
        run: tar -czf texlive.tar.gz -C ${{ env.TEXLIVE_DIR }} .

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TeX Live ${{ env.RELEASE_TAG }} (extra, cyrillic, fonts)
          files: texlive.tar.gz
